<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi primera web — Rafa</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(160deg, #1e3a8a, #7c3aed);
      color: #ffffff;
      text-align: center;
    }
    main { max-width: 32rem; }
    h1 { font-size: 2rem; margin: 0 0 0.5rem; }
    p { font-size: 1.15rem; line-height: 1.5; margin: 0; }
    time {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.5rem 1rem;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 999px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hola, mundo.</h1>
    <p>Soy Rafa y esta es mi primera web publicada.</p>
    <time datetime="2026-09-09">9 de septiembre de 2026</time>
  </main>
</body>
</html>
